[project]
name = "helpdesk-agent-assignment"
version = "0.1.0"
description = "A local IT Helpdesk agent assignment."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.1,<5",
    "fastapi>=0.115,<1",
    "httpx2",
    "pydantic>=2,<3",
    "uvicorn>=0.30,<1",
    "langchain[mcp]>=1.4.6,<2",
    "langgraph>=1.2.16",
    "langchain-anthropic>=1.7.6",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "jsonschema>=4.26,<5",
    "langfuse>=5.0.3,<6",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "helpdesk"
module-root = "backend/src"

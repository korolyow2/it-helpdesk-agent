name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  HELPDESK_TRACING_ENABLED: "false"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  protocol:
    name: Python and protocol checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.9.5"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Run Python tests and requirement checks
        run: |
          report_dir="$RUNNER_TEMP/helpdesk-protocol"
          mkdir -p "$report_dir"
          # Never upload the historical report from the checkout as a CI result.
          rm -f evals/results/latest-protocol.json
          status=0
          uv run --locked python -m helpdesk.evals --mode protocol 2>&1 | tee "$report_dir/protocol.log" || status=$?
          if [[ -f evals/results/latest-protocol.json ]]; then
            cp evals/results/latest-protocol.json "$report_dir/protocol.json"
          fi
          exit "$status"
      - name: Upload protocol report and log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: protocol-results
          path: ${{ runner.temp }}/helpdesk-protocol/
          retention-days: 7
          if-no-files-found: warn

  frontend:
    name: JavaScript checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Run stream and approval tests
        run: node --test frontend/tests/*.test.mjs 2>&1 | tee "$RUNNER_TEMP/helpdesk-frontend.log"
      - name: Upload frontend test log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: frontend-results
          path: ${{ runner.temp }}/helpdesk-frontend.log
          retention-days: 7
          if-no-files-found: warn

  container:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build application image
        env:
          DOCKER_BUILDKIT: "1"
        run: docker build --progress=plain --tag helpdesk-ci:test . 2>&1 | tee "$RUNNER_TEMP/helpdesk-docker.log"
      - name: Upload Docker build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: container-results
          path: ${{ runner.temp }}/helpdesk-docker.log
          retention-days: 7
          if-no-files-found: warn
